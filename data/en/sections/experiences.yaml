# Your experiences
experiences:
- company:
    name: Improbable Worlds Ltd.
    url: "https://www.improbable.io"
    location: Remote
    overview: "Metaverse and multiplayer-technology company building large-scale virtual worlds and game-server hosting. (Including Zeuz GmbH, acquired by Improbable in 2020, and Improbable MV Ltd.)"
  positions:
  - designation: DevOps Engineer
    start: Mar 2019
    responsibilities:
    - Recognized as part of the award-winning DevOps team honored by Google Cloud's 2022 DevOps Awards for building a scalable, cost-efficient, cloud-native CI/CD platform.
    - Developed and operated multi-region cloud infrastructure using Terraform, Docker Swarm, and Kubernetes, achieving 99.99% uptime for large-scale game-server deployments.
    - Migrated CI/CD pipelines from Buildkite to GitHub Actions, improving deployment reliability, cutting operational cost by about 20%, and speeding up delivery.
    - Ran services on Cloud Run, Compute Engine MIGs, and AWS EC2 Auto Scaling Groups, plus Kubernetes and Docker Swarm game-server clusters (EKS, GKE) across bare-metal (Gcore, G-Portal, Hetzner) and cloud, behind global load balancers, Cloud CDN, and Cloud Armor.
    - Provisioned multi-region GKE clusters in GCP from scratch with Terraform (node pools, networking, and Cloud Armor), handled Kubernetes version and node-pool upgrades, and managed Helm chart releases, updates, and rollouts for platform services.
    - Operated Cloud SQL and Amazon RDS/Aurora for PostgreSQL (IAM auth, PITR, read replicas, and pg_partman partitioning), Memorystore/Redis, and QuestDB; ran schema migrations with golang-migrate through the Cloud SQL Auth Proxy.
    - Optimized and modernized backend services (for example, moving from ExpressJS to Fastify) and tuned application performance through load testing, database indexing, and Cloud Run configuration.
    - Built and maintained a CI/CD-as-a-Service platform that supported hundreds of daily builds and reduced cost per build by over 60%, as highlighted in Google Cloud's DevOps case study.
    - Set up observability with Prometheus and Google Managed Prometheus (via OpenTelemetry), Grafana, Grafana Cloud, Loki, and Datadog, with alerts routed through Rootly.
    - Managed on-call operations and incident response for live game-server environments, holding SLA/SLO targets and cutting downtime through root cause analysis.
    - Worked with engineering teams across regions to align architecture, improve deployments, and speed up performance work.

